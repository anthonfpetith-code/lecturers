<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>师资力量 · AIGC 讲师团队</title>
<meta name="description" content="AIGC 讲师团队集合页：陈琪昌、陈昊男、王漪博、周于凯、陈家龙。覆盖 AIGC 视频工作流、短视频实战教育、AI 短剧全流程训练、AI 宣传片创作等方向。">
<style>
  :root{
    --bg:#0D0F12;
    --bg-soft:#13161B;
    --ink:#E5E7EA;
    --ink-dim:#9AA3AD;
    --ink-faint:#5C6570;
    --line:#1F242B;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
    --sans:"Noto Sans SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.8;overflow-x:hidden}
  ::selection{background:rgba(229,231,234,.25)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px}
  .glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(50rem 32rem at 80% -8%,rgba(229,231,234,.045),transparent 62%),
      radial-gradient(40rem 28rem at -10% 40%,rgba(229,231,234,.025),transparent 60%)}

  /* ===== Header ===== */
  header{padding:clamp(56px,9vw,110px) 0 clamp(36px,5vw,52px)}
  .tag{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.34em;
    color:var(--ink-dim);padding:8px 4px 8px 0;margin-bottom:22px}
  .tag::before{content:"";width:34px;height:1px;background:var(--ink-dim);opacity:.7}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(36px,6.5vw,58px);
    letter-spacing:.12em;line-height:1.15}
  .sub{margin-top:18px;font-size:clamp(14px,2.2vw,16px);color:var(--ink-dim);letter-spacing:.1em;max-width:640px}
  .sub b{color:var(--ink);font-weight:600}
  .count{display:flex;align-items:baseline;gap:8px;margin-top:26px;color:var(--ink-faint);
    font-size:13px;letter-spacing:.18em}
  .count b{font-family:var(--serif);font-size:22px;color:var(--ink);letter-spacing:.02em}

  /* ===== 卡片网格 ===== */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:clamp(64px,9vw,110px)}
  .card{
    position:relative;display:flex;flex-direction:column;
    background:var(--bg-soft);border:1px solid var(--line);
    text-decoration:none;color:inherit;overflow:hidden;
    transition:transform .45s ease,border-color .45s ease,box-shadow .45s ease;
  }
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--c);opacity:.85;z-index:2}
  .card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--c) 45%,var(--line));
    box-shadow:0 24px 56px rgba(0,0,0,.5)}
  .card:hover .more{color:var(--c);letter-spacing:.24em}
  .photo-box{position:relative;overflow:hidden;background:#0a0a0a}
  .photo-box img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top center;
    filter:saturate(.94) brightness(.98);transition:transform .6s ease,opacity .5s ease}
  .card:hover .photo-box img{transform:scale(1.035)}
  .photo-box::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 55%,rgba(13,15,18,.55) 82%,rgba(13,15,18,.9) 100%)}
  .badge{position:absolute;top:14px;left:14px;z-index:2;font-size:11px;letter-spacing:.16em;
    padding:5px 12px;color:var(--ink);background:rgba(13,15,18,.72);
    border:1px solid color-mix(in srgb,var(--c) 55%,transparent);backdrop-filter:blur(6px)}

  .body{display:flex;flex-direction:column;flex:1;padding:20px 22px 22px}
  .name-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .name{font-family:var(--serif);font-size:clamp(22px,3vw,26px);font-weight:700;letter-spacing:.1em}
  .title{font-size:12.5px;color:var(--c);letter-spacing:.1em}
  .desc{margin-top:10px;font-size:13.5px;color:var(--ink-dim);line-height:1.95;flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{font-size:11.5px;color:var(--ink-dim);letter-spacing:.04em;
    padding:4px 11px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
  .more{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-faint);letter-spacing:.2em;
    display:flex;align-items:center;justify-content:space-between;
    transition:color .4s ease,letter-spacing .4s ease}
  .more::after{content:"→";font-family:var(--sans)}

  footer{padding:26px 0 34px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-faint);letter-spacing:.14em;text-align:center}

  /* ===== 入场动画 ===== */
  .rise{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
  .rise.in{opacity:1;transform:none}
  .d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}

  @media (prefers-reduced-motion:reduce){
    .rise{opacity:1;transform:none;transition:none}
    .card,.photo-box img{transition:none}
  }
  @media (max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .body{padding:18px 20px 20px}
  }
</style>
</head>
<body>
<div class="glow"></div>

<div class="wrap">
  <header class="rise">
    <div class="tag">FACULTY · 师资力量</div>
    <h1>AIGC 讲师团队</h1>
    <p class="sub">深耕 <b>AIGC 视频创作与教学落地</b>的实战讲师阵容，覆盖工作流开发、短视频实战教育、AI 短剧全流程训练、AI 宣传片创作等方向。</p>
    <div class="count"><b id="num">3</b><span>位讲师 / 持续扩充</span></div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>AIGC 讲师团队 · 师资介绍</footer>
</div>

<script>
/* =====================================================================
   讲师数据（在这里加新讲师）
   ---------------------------------------------------------------------
   新增步骤：
   1. 在仓库（本目录）下新建子文件夹，放入该讲师的 index.html 和 photo.jpg
   2. 复制下面一组 { } 到数组末尾，改掉 name / dir / title / tags / desc
   3. color 填该讲师页面主题色的十六进制值（卡片点缀条与标题色）
   ===================================================================== */
const LECTURERS = [
  {
    name: "陈琪昌",
    dir: "chenqichang/",
    title: "AIGC 视频训练师",
    color: "#D4AF37",
    tags: ["AIGC 视频工作流", "千万级播放", "Seedance 2.5 先行者"],
    desc: "累计完成 2000+ 分钟 AIGC 内容制作，多部作品千万级播放；Seedance 2.5 / Happyhorse 内测工作流开发先行者，自研漫剧前置资产 Skills 工作流；温州广电三期百人培训、武汉文理学院二期培训落地交付。"
  },
  {
    name: "陈昊男",
    dir: "chenhaonan/",
    title: "实战派短视频导师",
    color: "#7DB5A0",
    tags: ["10 年传统影视经验", "数十万学员", "企业 AIGC 转型"],
    desc: "从传统影视到 AIGC 内容创作的成功转型者，10 年传统影视行业经验；服务东风日产、东阿阿胶、上汽进口、麦吉丽等品牌；临海青创学院 AI 影视培训班（一、二期）、嘉兴蓝环星 OPC 超级社区 AI 短剧实训营（一、二、三期）主讲。"
  },
  {
    name: "王漪博",
    dir: "wangyibo/",
    title: "AIGC 影视训练讲师",
    color: "#38BDF8",
    tags: ["AI 短剧全流程", "提示词工程", "降本增效"],
    desc: "六大课程模块覆盖 AI 短剧全流程：提示词工程、分镜运镜、人物资产、商业视觉与变现路径；爆款率达行业均值 2.3 倍，单条视频制作成本降低 80%。"
  },
  {
    name: "周于凯",
    dir: "zhouyukai/",
    title: "AIGC 视频创作专家",
    color: "#C9D1D9",
    tags: ["2000+ 分钟 AIGC 创作", "千万级播放", "AI 短剧讲师"],
    desc: "AIGC 视频创作专家、AI 短剧讲师。累计创作内容超 2000 分钟，作品覆盖红果剧场、TikTok 等主流平台，多部作品播放量突破千万级；温州广电三期 AI 短剧专项培训、各区县文旅系统 AI 宣传片创作培训。"
  },
  {
    name: "陈家龙",
    dir: "chenjialong/",
    title: "AIGC 视频导师",
    color: "#D46A7E",
    tags: ["单部 8000 万+ 播放", "累计播放 1 亿+", "温州广电合作导师"],
    desc: "红果短剧与海外平台多部千万级爆款制作负责人，作品累计播放超 1 亿，单部最佳 8000 万+；温州广电集团 AIGC 培训战略合作导师。"
  }
];

/* ---- 渲染（以下无需改动） ---- */
const grid = document.getElementById("grid");
LECTURERS.forEach((l, i) => {
  const a = document.createElement("a");
  a.className = "card rise d" + ((i % 3) + 1);
  a.href = l.dir;
  a.style.setProperty("--c", l.color);
  a.innerHTML = `
    <div class="photo-box">
      <span class="badge">${l.title}</span>
      <img src="${l.dir}photo.jpg" alt="${l.name}" loading="lazy">
    </div>
    <div class="body">
      <div class="name-row"><span class="name">${l.name}</span><span class="title">${l.title}</span></div>
      <p class="desc">${l.desc}</p>
      <div class="chips">${l.tags.map(t => `<span class="chip">${t}</span>`).join("")}</div>
      <span class="more">查看详情</span>
    </div>`;
  grid.appendChild(a);
});
document.getElementById("num").textContent = LECTURERS.length;

/* ---- 入场动画 ---- */
const io = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: .12 });
document.querySelectorAll(".rise").forEach(el => io.observe(el));
</script>
</body>
</html>
